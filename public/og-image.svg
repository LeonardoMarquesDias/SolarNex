<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#003D7A"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003D7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001F4D;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Large sun icon -->
  <g transform="translate(900, 150)">
    <circle cx="0" cy="0" r="70" fill="#FBBF24"/>
    <line x1="0" y1="-100" x2="0" y2="-140" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="100" x2="0" y2="140" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="100" y1="0" x2="140" y2="0" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="-100" y1="0" x2="-140" y2="0" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="70" y1="-70" x2="99" y2="-99" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="-70" y1="70" x2="-99" y2="99" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="-70" y1="-70" x2="-99" y2="-99" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="99" y2="99" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Text content -->
  <text x="120" y="200" font-size="96" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif">
    SolarNex
  </text>

  <text x="120" y="280" font-size="56" font-weight="600" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif">
    Complete Solar Solutions
  </text>

  <text x="120" y="370" font-size="36" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">
    for Your Home & Business
  </text>

  <text x="120" y="480" font-size="28" fill="#D1D5DB" font-family="system-ui, -apple-system, sans-serif">
    Connect with certified solar experts and start saving today
  </text>
</svg>